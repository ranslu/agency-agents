name: Agency Platform

# The platform reads every agent file, so any agent change can break it.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: platform tests + quality report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python3 -m unittest discover -s platform/tests -v
      - name: Agent quality report (informational)
        run: python3 platform/agency.py score -n 25
